[build-system]
requires = ["meson-python", "pybind11"]
build-backend = "mesonpy"

[project]
name = "frxx-view"
version = "0.1.4.2"
description = "Weather radar visualization GUI for (but not limited to) frxx."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name="Ameya Naik" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "frxx>=0.1.4.2",
    "setproctitle",
    "PySide6",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[project.scripts]
frxxv = "frxxv.app:main"
frxx-view = "frxxv.app:main"

[project.urls]
"Homepage" = "https://github.com/aeol1an/frxx-view"
"Bug Tracker" = "https://github.com/aeol1an/frxx-view/issues"
